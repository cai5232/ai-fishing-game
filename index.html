<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:#fff; color:#111; font-family:-apple-system,'Helvetica Neue',sans-serif; height:100svh; display:flex; flex-direction:column; overflow:hidden; position:relative; }
#main { display:flex; flex-direction:column; flex:1; overflow:hidden; }

#quick-btns { display:flex; gap:8px; padding:8px 20px; overflow-x:auto; flex-shrink:0; border-top:1px solid #f0f0f0; scrollbar-width:none; }

.qbtn { background:#f2f2f2; color:#333; border:none; border-radius:20px; padding:6px 14px; font-size:13px; white-space:nowrap; cursor:pointer; flex-shrink:0; font-family:inherit; }

.fullpage.open { display:flex; }
#settings-body { flex:1; overflow-y:auto; padding-bottom:max(40px,env(safe-area-inset-bottom)); }
.settings-title { font-size:34px; font-weight:700; padding:16px 20px; color:#111; }

.account-sub { font-size:13px; color:#888; margin-top:2px; }
.account-arrow { color:#c7c7cc; }

.settings-group { margin:0 16px 24px; background:#fff; border-radius:14px; overflow:hidden; }

<script>
const output = document.getElementById('output');
const input  = document.getElementById('cmd-input');
const ledger = [];
const BASE   = window.location.origin;

const accounts = [
  { name:'钓鱼佬', avatar:'🎣', sub:'点击切换到小克的账号', isKiro:false },
  { name:'小克',   avatar:'🐟', sub:'点击切换回自己的账号', isKiro:true  },
];
let currentAccount = 0;

function switchAccount() {
  currentAccount = (currentAccount + 1) % accounts.length;
  const a = accounts[currentAccount];
  document.getElementById('account-name').textContent = a.name;
  document.getElementById('account-avatar').textContent = a.avatar;
  document.getElementById('account-sub').textContent = a.sub;
}

function isKiroAccount() { return accounts[currentAccount].isKiro; }

function parseStats(text) {
  const m = text.match(/📊\s*(\{[^\n]*\})/);
  if (!m) return null;
  try { return JSON.parse(m[1]); } catch { return null; }
}
function cleanOutput(text) {
  return text.replace(/\n?📊\s*\{[^\n]*\}\s*$/, '').trim();
}
function updateTopbar(s) {
  if (!s) return;
  document.getElementById('stat-pts').textContent  = s.pts  ?? '—';
  document.getElementById('stat-loc').textContent  = s.loc  ?? '—';
  document.getElementById('stat-turn').textContent = s.turn ?? '—';
  document.getElementById('stat-enc').textContent  = s.enc  ?? '—';
}
function recordLedger(cmd, before, after) {
  if (!before || !after) return;
  const diff = (after.pts ?? 0) - (before.pts ?? 0);
  if (diff !== 0) ledger.push({ cmd, diff });
}
let lastStats = null;

async function send(cmd) {
  const q = cmd || input.value.trim();
  if (!q) return;
  input.value = '';
  const before = lastStats;
  const wrap = document.createElement('div'); wrap.className = 'msg-wrap';
  const card = document.createElement('div'); card.className = 'msg-card';
  card.textContent = '…';
  wrap.appendChild(card); output.appendChild(wrap);
  output.scrollTop = output.scrollHeight;
  try {
    const r = await fetch('/cmd?q=' + encodeURIComponent(q));
    const d = await r.json();
    const s = parseStats(d.result);
    card.textContent = cleanOutput(d.result);
    if (s) { recordLedger(q, before, s); updateTopbar(s); lastStats = s; }
  } catch(e) { card.textContent = '请求失败：' + e; }
  output.scrollTop = output.scrollHeight;
}

function openSettings()  { document.getElementById('page-settings').classList.add('open'); }
function closeSettings() { document.getElementById('page-settings').classList.remove('open'); }

function openSubpage(key) {
  const titles = { shop:'商店', wallet:'钱包', encyclopedia:'图鉴', sell:'卖鱼', bluetooth:'蓝牙' };
  document.getElementById('subpage-title').textContent = titles[key] || key;
  const body = document.getElementById('subpage-body');
  body.innerHTML = '';
  if      (key === 'shop')         renderShop(body);
  else if (key === 'wallet')       renderWallet(body);
  else if (key === 'bluetooth')    renderBluetooth(body);
  else if (key === 'sell')         renderSell(body);
  else if (key === 'encyclopedia') renderEncyclopedia(body);
  else body.innerHTML = '<div class="subpage-empty"><div class="ep-icon">🚧</div><div class="ep-text">即将上线</div></div>';
  document.getElementById('page-sub').classList.add('open');
}
function closeSubpage() { document.getElementById('page-sub').classList.remove('open'); }
const ITEM_DESCS = {
  basic_worm:'最普通的蚯蚓，上手即用，适合新手练手。',
  red_worm:'红色蚯蚓，诱鱼效果更好，稀有鱼概率小幅提升。',
  glow_bait:'夜光饵，深水鱼和稀有鱼更容易上钩。',
  oxygen:'氧气瓶，用于潜水远征，每瓶提供一单位下潜深度。',
};
const ITEM_EMOJI = { basic_worm:'🪱', red_worm:'🐛', glow_bait:'✨', oxygen:'🫧' };
let allShopItems = [];

function parseShopText(text) {
  const items = [];
  for (const line of text.split('\n')) {
    const m = line.match(/\[([^\]]+)\]\s+(.+?)\s+(\d+)\s*点/);
    if (m) {
      const id = m[1].trim(), name = m[2].trim(), price = parseInt(m[3]);
      const descM = line.match(/[（(]([^）)]+)[）)]/);
      const desc = descM ? descM[1] : (ITEM_DESCS[id] || '');
      items.push({ id, name, price, desc });
    }
  }
  return items;
}
function renderShopItems(items) {
  const list = document.getElementById('shop-items-list');
  if (!list) return;
  if (items.length === 0) { list.innerHTML = '<div class="shop-loading">没有找到相关物品</div>'; return; }
  list.innerHTML = items.map(item =>
    '<div class="shop-item" onclick="buyItem(\'' + item.id + '\',\'' + item.name + '\')">' +
    '<div class="shop-thumb"></div>' +
    '<div class="shop-info"><div class="shop-name">' + item.name + '</div>' +
    '<div class="shop-desc">' + (item.desc||'暂无介绍') + '</div></div>' +
    '<div class="shop-price">' + (item.price>0 ? item.price+'点' : '—') + '</div></div>'
  ).join('');
}
function filterShop(q) {
  const kw = q.trim().toLowerCase();
  if (!kw) { renderShopItems(allShopItems); return; }
  renderShopItems(allShopItems.filter(i =>
    i.name.toLowerCase().includes(kw)||i.id.toLowerCase().includes(kw)||(i.desc||'').toLowerCase().includes(kw)
  ));
}
async function renderShop(body) {
  body.innerHTML =
    '<div class="shop-search-wrap"><div class="shop-search">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
    '<input id="shop-search-input" placeholder="搜索物品…" oninput="filterShop(this.value)"></div></div>' +
    '<div class="shop-items" id="shop-items-list"><div class="shop-loading">加载中…</div></div>';
  try {
    const r = await fetch('/cmd?q=shop');
    const d = await r.json();
    allShopItems = parseShopText(d.result);
    if (allShopItems.length === 0) {
      allShopItems = Object.keys(ITEM_DESCS).map(id=>({ id, name:id, price:0, desc:ITEM_DESCS[id] }));
    }
    renderShopItems(allShopItems);
  } catch(e) {
    const l = document.getElementById('shop-items-list');
    if (l) l.innerHTML = '<div class="shop-loading">加载失败</div>';
  }
}
async function buyItem(id, name) {
  const qty = prompt('购买数量（' + name + '）:', '1');
  if (!qty || isNaN(qty) || parseInt(qty) <= 0) return;
  closeSubpage();
  await send('buy ' + id + ' ' + qty);
}
function parseSellText(text) {
  const items = [];
  for (const line of text.split('\n')) {
    const m = line.match(/(.+?)\s*[xX×]\s*(\d+)/);
    if (m) {
      const name = m[1].trim(), qty = parseInt(m[2]);
      const priceM = line.match(/(\d+)\s*点/);
      const price = priceM ? parseInt(priceM[1]) : 0;
      items.push({ name, qty, price });
    }
  }
  return items;
}

async function renderSell(body) {
  body.innerHTML = '<div class="shop-loading">加载中…</div>';
  try {
    const r = await fetch('/cmd?q=inventory');
    const d = await r.json();
    const text = cleanOutput(d.result);
    const items = parseSellText(text);
    if (items.length === 0) {
      body.innerHTML = '<div class="subpage-empty"><div class="ep-icon">🎣</div><div class="ep-text">鱼篓是空的</div></div>';
      return;
    }
    let html = '<button class="sell-all-btn" onclick="sellAll()">全部卖出</button>';
    html += '<div class="sell-total"><span class="sell-total-label">鱼篓总数</span><span class="sell-total-val">' +
      items.reduce((a,i)=>a+i.qty,0) + ' 条</span></div>';
    html += items.map((item,idx) =>
      '<div class="sell-item">' +
      '<div class="sell-thumb"></div>' +
      '<div class="sell-info">' +
      '<div class="sell-name">' + item.name + '</div>' +
      '<div class="sell-desc">' + (item.price>0 ? '单价 '+item.price+' 点' : '可出售') + '</div>' +
      '</div>' +
      '<div class="sell-right">' +
      '<div class="sell-qty">× ' + item.qty + '</div>' +
      '<div class="sell-btns">' +
      '<button class="sell-btn one" onclick="sellOne(\'' + item.name + '\')">卖1条</button>' +
      '<button class="sell-btn all" onclick="sellAllOne(\'' + item.name + '\',' + item.qty + ')">全卖</button>' +
      '</div></div></div>'
    ).join('');
    body.innerHTML = html;
  } catch(e) {
    body.innerHTML = '<div class="subpage-empty"><div class="ep-icon">⚠️</div><div class="ep-text">加载失败</div></div>';
  }
}

async function sellOne(name) {
  closeSubpage();
  await send('sell ' + name + ' 1');
}
async function sellAllOne(name, qty) {
  closeSubpage();
  await send('sell ' + name + ' ' + qty);
}
async function sellAll() {
  closeSubpage();
  await send('sell all');
}

let encFilter = 'all';
let encUnlocked = new Set();

async function renderEncyclopedia(body) {
  if (isKiroAccount()) {
    encUnlocked = new Set(['carp','bass','trout','salmon','tuna']);
  } else {
    try {
      const r = await fetch('/cmd?q=encyclopedia');
      const d = await r.json();
      const text = d.result;
      encUnlocked = new Set();
      for (const fish of FISH_DB) {
        if (text.includes(fish.name) || text.includes(fish.id)) encUnlocked.add(fish.id);
      }
    } catch(e) { encUnlocked = new Set(); }
  }
  encFilter = 'all';
  renderEncBody(body);
}

function renderEncBody(body) {
  let html =
    '<div class="shop-search-wrap">' +
    '<div class="shop-search">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
    '<input id="enc-search-input" placeholder="搜索鱼类…" oninput="filterEnc(this.value)">' +
    '</div>' +
    '<div class="enc-filter">' +
    '<button class="enc-filter-btn' + (encFilter==='unlocked'?' active':'') + '" onclick="setEncFilter(\'unlocked\')">已解锁</button>' +
    '<button class="enc-filter-btn' + (encFilter==='locked'?' active':'') + '" onclick="setEncFilter(\'locked\')">未解锁</button>' +
    '</div></div>' +
    '<div class="enc-grid" id="enc-grid"></div>';
  body.innerHTML = html;
  renderEncGrid(FISH_DB, '');
}

function setEncFilter(f) {
  encFilter = encFilter === f ? 'all' : f;
  const body = document.getElementById('subpage-body');
  renderEncBody(body);
}

function filterEnc(q) {
  const kw = q.trim().toLowerCase();
  const filtered = FISH_DB.filter(f =>
    f.name.toLowerCase().includes(kw) || f.type.toLowerCase().includes(kw)
  );
  renderEncGrid(filtered, kw);
}

function renderEncGrid(list, kw) {
  let items = list;
  if (encFilter === 'unlocked') items = list.filter(f => encUnlocked.has(f.id));
  if (encFilter === 'locked')   items = list.filter(f => !encUnlocked.has(f.id));
  const grid = document.getElementById('enc-grid');
  if (!grid) return;
  if (items.length === 0) { grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#aaa;padding:40px 0">暂无数据</div>'; return; }
  grid.innerHTML = items.map(f => {
    const locked = !encUnlocked.has(f.id);
    return '<div class="enc-card" onclick="openEncModal(\'' + f.id + '\')">' +
      '<div class="enc-img' + (locked?' locked':'') + '"></div>' +
      '<div class="enc-card-name' + (locked?' locked':'') + '">' + (locked?'???':f.name) + '</div>' +
      '</div>';
  }).join('');
}

function openEncModal(id) {
  const f = FISH_DB.find(x => x.id === id);
  if (!f) return;
  const locked = !encUnlocked.has(f.id);
  document.getElementById('enc-modal-name').textContent   = locked ? '???' : f.name;
  document.getElementById('enc-modal-type').textContent   = locked ? '未知' : f.type;
  const statusEl = document.getElementById('enc-modal-status');
  statusEl.textContent  = locked ? '未解锁' : '已解锁';
  statusEl.className    = 'enc-modal-status ' + (locked ? 'locked' : 'unlocked');
  document.getElementById('enc-modal-desc').textContent   = locked ? '钓到这种鱼后解锁详细信息。' : f.desc;
  document.getElementById('enc-modal-bg').classList.add('open');
}
function closeEncModal(e) {
  if (!e || e.target === document.getElementById('enc-modal-bg'))
    document.getElementById('enc-modal-bg').classList.remove('open');
}
function renderWallet(body) {

function renderBluetooth(body) {
  const url = BASE + '/mcp/fishing';

    '</div>';
}

function copyMcp() {
  const url = BASE + '/mcp/fishing';
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('copybtn');
    btn.textContent = '已复制！';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制接口地址'; btn.classList.remove('copied'); }, 2000);
  });
}

async function init() {
  try {
    const r = await fetch('/cmd?q=status');
    const d = await r.json();
    const s = parseStats(d.result);
    const card = document.createElement('div'); card.className = 'msg-card';
    card.textContent = cleanOutput(d.result);
    const wrap = document.createElement('div'); wrap.className = 'msg-wrap';
    wrap.appendChild(card); output.appendChild(wrap);
    if (s) { updateTopbar(s); lastStats = s; }
  } catch(e) { setTimeout(init, 2000); }
}
init();
