<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fishing">
<meta name="mobile-web-app-capable" content="yes">
<title>Fishing</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background:#fff; color:#111; font-family:-apple-system,'Helvetica Neue',sans-serif; height:100svh; display:flex; flex-direction:column; overflow:hidden; position:relative; }
#main { display:flex; flex-direction:column; flex:1; overflow:hidden; }
#topbar { display:flex; align-items:center; justify-content:space-between; padding:18px 20px 10px; border-bottom:1px solid #f0f0f0; flex-shrink:0; gap:12px; }
#topbar-left { display:flex; align-items:center; gap:14px; flex:1; min-width:0; }
#title { font-size:28px; font-weight:700; letter-spacing:-1px; line-height:1; color:#111; flex-shrink:0; }
#stats { display:flex; align-items:center; flex:1; min-width:0; }
.stat-item { display:flex; flex-direction:column; align-items:center; flex:1; min-width:0; }
.stat-val { font-size:13px; font-weight:600; color:#111; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.stat-label { font-size:9px; color:#aaa; line-height:1.2; white-space:nowrap; }
.stat-divider { width:1px; height:24px; background:#e8e8e8; flex-shrink:0; }
#topbar-right { display:flex; gap:14px; align-items:center; flex-shrink:0; }
.icon-btn { background:none; border:none; cursor:pointer; color:#111; padding:8px; display:flex; align-items:center; justify-content:center; border-radius:50%; margin:-4px; }
.icon-btn:active { background:#f0f0f0; }
.icon-btn svg { width:22px; height:22px; display:block; }
#output { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; }
.msg-wrap { display:flex; flex-direction:column; }
.msg-card { background:#f7f7f7; border-radius:14px; padding:12px 14px; font-size:13.5px; line-height:1.7; color:#222; white-space:pre-wrap; word-break:break-all; font-family:monospace; }
#quick-btns { display:flex; gap:8px; padding:8px 20px; overflow-x:auto; flex-shrink:0; border-top:1px solid #f0f0f0; scrollbar-width:none; }
#quick-btns::-webkit-scrollbar { display:none; }
.qbtn { background:#f2f2f2; color:#333; border:none; border-radius:20px; padding:6px 14px; font-size:13px; white-space:nowrap; cursor:pointer; flex-shrink:0; font-family:inherit; }
.qbtn:active { background:#e0e0e0; }
#input-row { display:flex; gap:10px; padding:10px 20px; padding-bottom:max(20px,env(safe-area-inset-bottom)); border-top:1px solid #f0f0f0; flex-shrink:0; }
#cmd-input { flex:1; background:#f2f2f2; color:#111; border:none; border-radius:22px; padding:10px 16px; font-size:14px; font-family:monospace; outline:none; }
#send-btn { background:#111; color:#fff; border:none; border-radius:22px; padding:10px 20px; font-size:14px; cursor:pointer; font-family:inherit; flex-shrink:0; }
#send-btn:active { background:#333; }

.fullpage { display:none; position:fixed; inset:0; background:#f2f2f7; z-index:200; flex-direction:column; overflow:hidden; }
.fullpage.open { display:flex; }
#settings-body { flex:1; overflow-y:auto; padding-bottom:max(40px,env(safe-area-inset-bottom)); }
.settings-title { font-size:34px; font-weight:700; padding:16px 20px; color:#111; }
.account-card { margin:0 16px 24px; background:#fff; border-radius:14px; padding:16px; display:flex; align-items:center; gap:14px; cursor:pointer; }
.account-card:active { background:#f5f5f5; }
.account-avatar { width:60px; height:60px; border-radius:50%; background:linear-gradient(135deg,#c9d6ff,#e2e2e2); display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; }
.account-info { flex:1; min-width:0; }
.account-name { font-size:20px; font-weight:600; color:#111; }
.account-sub { font-size:13px; color:#888; margin-top:2px; }
.account-arrow { color:#c7c7cc; }
.account-arrow svg { width:18px; height:18px; }
.settings-group { margin:0 16px 24px; background:#fff; border-radius:14px; overflow:hidden; }
.settings-row { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; border-bottom:1px solid #f2f2f2; min-height:50px; }
.settings-row:last-child { border-bottom:none; }
.settings-row:active { background:#f5f5f5; }
.s-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.s-icon svg { width:18px; height:18px; color:#fff; }
.s-label { flex:1; font-size:16px; color:#111; }
.s-arrow { color:#c7c7cc; }
.s-arrow svg { width:16px; height:16px; }

.fp-nav { display:flex; align-items:center; padding:56px 20px 10px; background:#f2f2f7; flex-shrink:0; gap:8px; }
.fp-back { background:none; border:none; cursor:pointer; color:#007aff; font-size:16px; display:flex; align-items:center; gap:4px; padding:4px 0; font-family:inherit; }
.fp-back svg { width:18px; height:18px; }
.fp-title { font-size:17px; font-weight:600; color:#111; flex:1; text-align:center; margin-right:60px; }
.subpage-body { flex:1; overflow-y:auto; padding:16px; padding-bottom:max(40px,env(safe-area-inset-bottom)); }
.subpage-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#aaa; padding:60px 0; }
.subpage-empty .ep-icon { font-size:48px; }
.subpage-empty .ep-text { font-size:15px; }

/* 商店 */
.shop-search-wrap { position:sticky; top:0; background:#f2f2f7; padding:0 0 12px; z-index:5; }
.shop-search { display:flex; align-items:center; background:#fff; border-radius:12px; padding:10px 14px; gap:8px; }
.shop-search svg { width:16px; height:16px; color:#aaa; flex-shrink:0; }
.shop-search input { flex:1; border:none; outline:none; font-size:14px; color:#111; background:transparent; font-family:inherit; }
.shop-search input::placeholder { color:#bbb; }
.shop-items { display:flex; flex-direction:column; gap:10px; }
.shop-item { background:#fff; border-radius:14px; padding:14px; display:flex; gap:12px; align-items:center; cursor:pointer; }
.shop-item:active { background:#f5f5f5; }
.shop-thumb { width:56px; height:56px; border-radius:10px; background:#e8e8e8; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#bbb; font-size:22px; }
.shop-info { flex:1; min-width:0; }
.shop-name { font-size:15px; font-weight:600; color:#111; margin-bottom:3px; }
.shop-desc { font-size:12px; color:#888; line-height:1.5; }
.shop-price { font-size:14px; font-weight:700; color:#ff9500; flex-shrink:0; white-space:nowrap; }
.shop-loading { text-align:center; color:#aaa; padding:40px 0; font-size:14px; }

/* 钱包/MCP */
.mcp-card { background:#fff; border-radius:14px; padding:20px; margin-bottom:16px; }
.mcp-card h3 { font-size:15px; font-weight:600; color:#111; margin-bottom:6px; }
.mcp-card p { font-size:13px; color:#888; margin-bottom:14px; line-height:1.5; }
.mcp-url { background:#f2f2f7; border-radius:10px; padding:12px 14px; font-family:monospace; font-size:12px; color:#333; word-break:break-all; margin-bottom:12px; line-height:1.6; }
.mcp-copy-btn { background:#007aff; color:#fff; border:none; border-radius:10px; padding:10px 20px; font-size:14px; cursor:pointer; font-family:inherit; width:100%; }
.mcp-copy-btn:active { background:#0062cc; }
.mcp-copy-btn.copied { background:#34c759; }
.mcp-badge { display:inline-block; background:#34c75922; color:#34c759; font-size:11px; padding:2px 8px; border-radius:20px; margin-left:8px; font-weight:600; }
.wallet-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f2f2f2; font-size:14px; }
.wallet-row .label { color:#555; }
.wallet-row .amount { font-weight:600; color:#111; }
.wallet-row .amount.neg { color:#e55; }
</style>
</head>

        <div class="stat-item"><span class="stat-val" id="stat-pts">—</span><span class="stat-label">点数</span></div>
        <div class="stat-divider"></div>

  <div style="position:absolute;top:16px;right:20px;z-index:10;">
    <button class="icon-btn" onclick="closeSettings()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

        <div class="account-name" id="account-name">钓鱼佬</div>

      </div>
      <div class="account-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>
    <div class="settings-group">
      <div class="settings-row" onclick="openSubpage('shop')">
        <div class="s-icon" style="background:#ff9500"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>
        <span class="s-label">商店</span>
        <div class="s-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
      <div class="settings-row" onclick="openSubpage('wallet')">
        <div class="s-icon" style="background:#34c759"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="3"/><path d="M16 3H6a2 2 0 0 0-2 2v2"/><circle cx="17" cy="14" r="1.5" fill="currentColor" stroke="none"/></svg></div>
        <span class="s-label">钱包</span>
        <div class="s-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
      <div class="settings-row" onclick="openSubpage('encyclopedia')">
        <div class="s-icon" style="background:#007aff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>

      </div>

        <span class="s-label">蓝牙</span>

</div>

<div id="page-sub" class="fullpage">
  <div class="fp-nav">
    <button class="fp-back" onclick="closeSubpage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      设置
    </button>
    <div class="fp-title" id="subpage-title">—</div>

  <div class="subpage-body" id="subpage-body"></div>

<script>
const output = document.getElementById('output');
const input  = document.getElementById('cmd-input');
const ledger = [];
const BASE   = window.location.origin;
const accounts = [{ name:'钓鱼佬', avatar:'🎣' },{ name:'小克', avatar:'🐟' }];
let currentAccount = 0;

function switchAccount() {
  currentAccount = (currentAccount + 1) % accounts.length;
  const a = accounts[currentAccount];
  document.getElementById('account-name').textContent = a.name;
  document.getElementById('account-avatar').textContent = a.avatar;
}

function parseStats(text) {
  const m = text.match(/📊\s*(\{[^\n]*\})/);
  if (!m) return null;
  try { return JSON.parse(m[1]); } catch { return null; }
}
function cleanOutput(text) {
  return text.replace(/\n?📊\s*\{[^\n]*\}\s*$/, '').trim();
}
function updateTopbar(s) {
  if (!s) return;
  document.getElementById('stat-pts').textContent  = s.pts  ?? '—';
  document.getElementById('stat-loc').textContent  = s.loc  ?? '—';
  document.getElementById('stat-turn').textContent = s.turn ?? '—';
  document.getElementById('stat-enc').textContent  = s.enc  ?? '—';
}
function recordLedger(cmd, before, after) {
  if (!before || !after) return;
  const diff = (after.pts ?? 0) - (before.pts ?? 0);
  if (diff !== 0) ledger.push({ cmd, diff });
}
let lastStats = null;

async function send(cmd) {
  const q = cmd || input.value.trim();
  if (!q) return;
  input.value = '';
  const before = lastStats;
  const wrap = document.createElement('div'); wrap.className = 'msg-wrap';
  const card = document.createElement('div'); card.className = 'msg-card';
  card.textContent = '…';
  wrap.appendChild(card); output.appendChild(wrap);
  output.scrollTop = output.scrollHeight;
  try {
    const r = await fetch('/cmd?q=' + encodeURIComponent(q));
    const d = await r.json();
    const s = parseStats(d.result);
    card.textContent = cleanOutput(d.result);
    if (s) { recordLedger(q, before, s); updateTopbar(s); lastStats = s; }
  } catch(e) { card.textContent = '请求失败：' + e; }
  output.scrollTop = output.scrollHeight;
}

function openSettings()  { document.getElementById('page-settings').classList.add('open'); }
function closeSettings() { document.getElementById('page-settings').classList.remove('open'); }

function openSubpage(key) {
  const titles = { shop:'商店', wallet:'钱包', encyclopedia:'图鉴', sell:'卖鱼', bluetooth:'蓝牙' };
  document.getElementById('subpage-title').textContent = titles[key] || key;
  const body = document.getElementById('subpage-body');
  body.innerHTML = '';
  if      (key === 'shop')      renderShop(body);
  else if (key === 'wallet')    renderWallet(body);
  else if (key === 'bluetooth') renderBluetooth(body);
  else body.innerHTML = '<div class="subpage-empty"><div class="ep-icon">🚧</div><div class="ep-text">即将上线</div></div>';
  document.getElementById('page-sub').classList.add('open');
}
function closeSubpage() { document.getElementById('page-sub').classList.remove('open'); }

// ── 商店 ──
const BAIT_EMOJIS = { basic_worm:'🪱', red_worm:'🐛', glow_bait:'✨', oxygen:'🫧' };
const BAIT_DESCS  = {
  basic_worm: '最普通的蚯蚓，上手即用，适合在月光池塘和芦苇河练手。',
  red_worm:   '红色蚯蚓，诱鱼效果更好，稀有鱼概率小幅提升。',
  glow_bait:  '夜光饵，深水鱼和稀有鱼更容易上钩。',
  oxygen:     '氧气瓶，用于潜水远征，每瓶提供一单位下潜深度。',
};

let allShopItems = [];

async function renderShop(body) {
  body.innerHTML =
    '<div class="shop-search-wrap">' +
    '<div class="shop-search">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
    '<input id="shop-search-input" placeholder="搜索鱼饵、氧气瓶..." oninput="filterShop(this.value)">' +
    '</div></div>' +
    '<div class="shop-items" id="shop-items-list"><div class="shop-loading">加载中…</div></div>';

  try {
    const r = await fetch('/cmd?q=shop');
    const d = await r.json();
    allShopItems = parseShopText(d.result);
    renderShopItems(allShopItems);
  } catch(e) {
    document.getElementById('shop-items-list').innerHTML = '<div class="shop-loading">加载失败</div>';
  }
}

function parseShopText(text) {
  const items = [];
  const lines = text.split('\n');
  for (const line of lines) {
    // 匹配格式：[id] 名字 xxx点 （其余信息）
    const m = line.match(/\[([^\]]+)\]\s+(.+?)\s+(\d+)\s*点/);
    if (m) {
      const id   = m[1].trim();
      const name = m[2].trim();
      const price= parseInt(m[3]);
      // 尝试从括号里取描述
      const descM = line.match(/[（(]([^）)]+)[）)]/);
      const desc = descM ? descM[1] : (BAIT_DESCS[id] || '');
      items.push({ id, name, price, desc });
    }
  }
  // 如果解析不到就回退到用内置描述展示已知物品
  if (items.length === 0) {
    return Object.entries(BAIT_DESCS).map(([id, desc]) => ({
      id, name: id, price: 0, desc
    }));
  }
  return items;
}

function renderShopItems(items)
