<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fishing">
<meta name="mobile-web-app-capable" content="yes">
<title>Fishing</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:#fff; color:#111; font-family:-apple-system,'Helvetica Neue',sans-serif; height:100svh; display:flex; flex-direction:column; overflow:hidden; position:relative; }
#main { display:flex; flex-direction:column; flex:1; overflow:hidden; }
#topbar { display:flex; align-items:center; justify-content:space-between; padding:18px 20px 10px; border-bottom:1px solid #f0f0f0; flex-shrink:0; gap:12px; }
#topbar-left { display:flex; align-items:center; gap:14px; flex:1; min-width:0; }
#title { font-size:28px; font-weight:700; letter-spacing:-1px; line-height:1; color:#111; flex-shrink:0; }
#stats { display:flex; align-items:center; flex:1; min-width:0; }
.stat-item { display:flex; flex-direction:column; align-items:center; flex:1; min-width:0; }
.stat-val { font-size:13px; font-weight:600; color:#111; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.stat-label { font-size:9px; color:#aaa; line-height:1.2; white-space:nowrap; }
.stat-divider { width:1px; height:24px; background:#e8e8e8; flex-shrink:0; }
#topbar-right { display:flex; gap:14px; align-items:center; flex-shrink:0; }
.icon-btn { background:none; border:none; cursor:pointer; color:#111; padding:8px; display:flex; align-items:center; justify-content:center; border-radius:50%; margin:-4px; }
.icon-btn:active { background:#f0f0f0; }
.icon-btn svg { width:22px; height:22px; display:block; }
#output { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; }
.msg-wrap { display:flex; flex-direction:column; }
.msg-card { background:#f7f7f7; border-radius:14px; padding:12px 14px; font-size:13.5px; line-height:1.7; color:#222; white-space:pre-wrap; word-break:break-all; font-family:monospace; }
#quick-btns { display:flex; gap:8px; padding:8px 20px; overflow-x:auto; flex-shrink:0; border-top:1px solid #f0f0f0; scrollbar-width:none; }
#quick-btns::-webkit-scrollbar { display:none; }
.qbtn { background:#f2f2f2; color:#333; border:none; border-radius:20px; padding:6px 14px; font-size:13px; white-space:nowrap; cursor:pointer; flex-shrink:0; font-family:inherit; }
.qbtn:active { background:#e0e0e0; }
#input-row { display:flex; gap:10px; padding:10px 20px; padding-bottom:max(20px,env(safe-area-inset-bottom)); border-top:1px solid #f0f0f0; flex-shrink:0; }
#cmd-input { flex:1; background:#f2f2f2; color:#111; border:none; border-radius:22px; padding:10px 16px; font-size:14px; font-family:monospace; outline:none; }
#send-btn { background:#111; color:#fff; border:none; border-radius:22px; padding:10px 20px; font-size:14px; cursor:pointer; font-family:inherit; flex-shrink:0; }
#send-btn:active { background:#333; }
.fullpage { display:none; position:fixed; inset:0; background:#f2f2f7; z-index:200; flex-direction:column; overflow:hidden; }
.fullpage.open { display:flex; }
#settings-body { flex:1; overflow-y:auto; padding-bottom:max(40px,env(safe-area-inset-bottom)); }
.settings-title { font-size:34px; font-weight:700; padding:16px 20px; color:#111; }
.account-card { margin:0 16px 24px; background:#fff; border-radius:14px; padding:16px; display:flex; align-items:center; gap:14px; cursor:pointer; }
.account-card:active { background:#f5f5f5; }
.account-avatar { width:60px; height:60px; border-radius:50%; background:linear-gradient(135deg,#c9d6ff,#e2e2e2); display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; }
.account-info { flex:1; min-width:0; }
.account-name { font-size:20px; font-weight:600; color:#111; }
.account-sub { font-size:13px; color:#888; margin-top:2px; }
.account-arrow { color:#c7c7cc; }
.account-arrow svg { width:18px; height:18px; }
.settings-group { margin:0 16px 24px; background:#fff; border-radius:14px; overflow:hidden; }
.settings-row { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; border-bottom:1px solid #f2f2f2; min-height:50px; }
.settings-row:last-child { border-bottom:none; }
.settings-row:active { background:#f5f5f5; }
.s-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.s-icon svg { width:18px; height:18px; color:#fff; }
.s-label { flex:1; font-size:16px; color:#111; }
.s-arrow { color:#c7c7cc; }
.s-arrow svg { width:16px; height:16px; }
.fp-nav { display:flex; align-items:center; padding:56px 20px 10px; background:#f2f2f7; flex-shrink:0; gap:8px; }
.fp-back { background:none; border:none; cursor:pointer; color:#007aff; font-size:16px; display:flex; align-items:center; gap:4px; padding:4px 0; font-family:inherit; }
.fp-back svg { width:18px; height:18px; }
.fp-title { font-size:17px; font-weight:600; color:#111; flex:1; text-align:center; margin-right:60px; }
.subpage-body { flex:1; overflow-y:auto; padding:16px; padding-bottom:max(40px,env(safe-area-inset-bottom)); }
.subpage-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#aaa; padding:60px 0; }
.subpage-empty .ep-icon { font-size:48px; }
.subpage-empty .ep-text { font-size:15px; }
</style>
<style>
.shop-search-wrap { padding:0 0 12px; }
.shop-search { display:flex; align-items:center; background:#fff; border-radius:12px; padding:10px 14px; gap:8px; }
.shop-search svg { width:16px; height:16px; color:#aaa; flex-shrink:0; }
.shop-search input { flex:1; border:none; outline:none; font-size:14px; color:#111; background:transparent; font-family:inherit; }
.shop-search input::placeholder { color:#bbb; }
.shop-items { display:flex; flex-direction:column; gap:10px; }
.shop-item { background:#fff; border-radius:14px; padding:14px; display:flex; gap:12px; align-items:center; cursor:pointer; }
.shop-item:active { background:#f5f5f5; }
.shop-thumb { width:56px; height:56px; border-radius:10px; background:#e8e8e8; flex-shrink:0; }
.shop-info { flex:1; min-width:0; }
.shop-name { font-size:15px; font-weight:600; color:#111; margin-bottom:3px; }
.shop-desc { font-size:12px; color:#888; line-height:1.5; }
.shop-price { font-size:14px; font-weight:700; color:#ff9500; flex-shrink:0; white-space:nowrap; }
.shop-loading { text-align:center; color:#aaa; padding:40px 0; font-size:14px; }
.sell-item { background:#fff; border-radius:14px; padding:14px; display:flex; gap:12px; align-items:center; margin-bottom:10px; }
.sell-thumb { width:56px; height:56px; border-radius:10px; background:#e8e8e8; flex-shrink:0; }
.sell-info { flex:1; min-width:0; }
.sell-name { font-size:15px; font-weight:600; color:#111; margin-bottom:3px; }
.sell-desc { font-size:12px; color:#888; line-height:1.5; }
.sell-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
.sell-qty { font-size:11px; color:#bbb; }
.sell-btns { display:flex; gap:6px; }
.sell-btn { border:none; border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
.sell-btn.one { background:#f2f2f2; color:#333; }
.sell-btn.one:active { background:#e0e0e0; }
.sell-btn.all { background:#ff3b30; color:#fff; }
.sell-btn.all:active { background:#c0392b; }
.sell-total { background:#fff; border-radius:14px; padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.sell-total-label { font-size:14px; color:#555; }
.sell-total-val { font-size:16px; font-weight:700; color:#111; }
.sell-all-btn { width:100%; background:#ff3b30; color:#fff; border:none; border-radius:14px; padding:14px; font-size:16px; font-weight:600; cursor:pointer; font-family:inherit; margin-bottom:10px; }
.sell-all-btn:active { background:#c0392b; }
.enc-filter { display:flex; justify-content:flex-end; gap:8px; margin-bottom:12px; }
.enc-filter-btn { background:#fff; border:1.5px solid #e0e0e0; border-radius:20px; padding:5px 14px; font-size:13px; color:#555; cursor:pointer; font-family:inherit; }
.enc-filter-btn.active { background:#007aff; border-color:#007aff; color:#fff; }
.enc-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.enc-card { background:#fff; border-radius:12px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; }
.enc-card:active { opacity:0.8; }
.enc-img { width:100%; aspect-ratio:1; background:#e8e8e8; }
.enc-img.locked { background:#f0f0f0; }
.enc-card-name { font-size:12px; color:#111; padding:6px 6px 8px; text-align:center; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.enc-card-name.locked { color:#bbb; }
.enc-modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:500; align-items:center; justify-content:center; padding:24px; }
.enc-modal-bg.open { display:flex; }
.enc-modal { background:#fff; border-radius:20px; padding:28px 24px 24px; width:100%; max-width:320px; }
.enc-modal-name { font-size:22px; font-weight:700; color:#111; text-align:center; margin-bottom:10px; }
.enc-modal-meta { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:16px; }
.enc-modal-type { font-size:13px; color:#888; }
.enc-modal-status { font-size:13px; font-weight:600; }
.enc-modal-status.unlocked { color:#34c759; }
.enc-modal-status.locked { color:#bbb; }
.enc-modal-desc { font-size:14px; color:#555; line-height:1.7; }
.enc-modal-close { width:100%; background:#f2f2f2; border:none; border-radius:12px; padding:12px; font-size:15px; color:#333; cursor:pointer; font-family:inherit; margin-top:20px; }
.enc-modal-close:active { background:#e0e0e0; }
.mcp-card { background:#fff; border-radius:14px; padding:20px; margin-bottom:16px; }
.mcp-card h3 { font-size:15px; font-weight:600; color:#111; margin-bottom:6px; }
.mcp-card p { font-size:13px; color:#888; margin-bottom:14px; line-height:1.5; }
.mcp-url { background:#f2f2f7; border-radius:10px; padding:12px 14px; font-family:monospace; font-size:12px; color:#333; word-break:break-all; margin-bottom:12px; line-height:1.6; }
.mcp-copy-btn { background:#007aff; color:#fff; border:none; border-radius:10px; padding:10px 20px; font-size:14px; cursor:pointer; font-family:inherit; width:100%; }
.mcp-copy-btn:active { background:#0062cc; }
.mcp-copy-btn.copied { background:#34c759; }
.mcp-badge { display:inline-block; background:#34c75922; color:#34c759; font-size:11px; padding:2px 8px; border-radius:20px; margin-left:8px; font-weight:600; }
.wallet-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #f2f2f2; font-size:14px; }
.wallet-row-left { display:flex; flex-direction:column; gap:2px; }
.wallet-row-type { font-size:11px; color:#aaa; }
.wallet-row-label { color:#333; }
.wallet-row .amount { font-weight:600; color:#111; white-space:nowrap; }
.wallet-row .amount.neg { color:#e55; }
.map-season-bar { display:flex; gap:8px; margin-bottom:14px; }
.map-season-btn { flex:1; background:#fff; border:1.5px solid #e0e0e0; border-radius:20px; padding:6px 0; font-size:13px; color:#555; cursor:pointer; font-family:inherit; text-align:center; }
.map-season-btn.active { border-color:#007aff; color:#007aff; font-weight:600; background:#e8f0ff; }
.map-item { background:#fff; border-radius:14px; padding:14px; display:flex; gap:12px; align-items:center; margin-bottom:10px; cursor:pointer; }
.map-item:active { background:#f5f5f5; }
.map-thumb { width:56px; height:56px; border-radius:10px; flex-shrink:0; }
.map-info { flex:1; min-width:0; }
.map-name { font-size:15px; font-weight:600; color:#111; margin-bottom:3px; }
.map-fish-hint { font-size:12px; color:#888; line-height:1.5; }
.map-right { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.map-cost { font-size:12px; color:#ff9500; font-weight:600; white-space:nowrap; }
.map-current { font-size:11px; color:#34c759; font-weight:600; white-space:nowrap; }
.map-season-tag { display:inline-block; font-size:10px; padding:2px 7px; border-radius:10px; margin-right:4px; margin-bottom:2px; }
.map-season-tag.春 { background:#fff0f0; color:#e07070; }
.map-season-tag.夏 { background:#f0fff0; color:#50a050; }
.map-season-tag.秋 { background:#fff8e8; color:#c08030; }
.map-season-tag.冬 { background:#f0f4ff; color:#6080c0; }
.map-season-tag.全年 { background:#f2f2f2; color:#888; }
</style>
</head>
<body>
<div id="main">
  <div id="topbar">
    <div id="topbar-left">
      <div id="title">Fishing</div>
      <div id="stats">
        <div class="stat-item"><span class="stat-val" id="stat-pts">—</span><span class="stat-label">点数</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-val" id="stat-loc">—</span><span class="stat-label">地图</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-val" id="stat-turn">—</span><span class="stat-label">回合</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-val" id="stat-enc">—</span><span class="stat-label">图鉴</span></div>
      </div>
    </div>
    <div id="topbar-right">
      <button class="icon-btn" onclick="openSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>
  <div id="output"></div>
  <div id="quick-btns">
    <button class="qbtn" onclick="send('status')">状态</button>
    <button class="qbtn" onclick="send('cast')">钓一竿</button>
    <button class="qbtn" onclick="send('cast 10')">钓10竿</button>
    <button class="qbtn" onclick="send('inventory')">鱼篓</button>
    <button class="qbtn" onclick="send('help')">帮助</button>
  </div>
  <div id="input-row">
    <input id="cmd-input" placeholder="输入指令，如 cast / buy basic_worm 5" onkeydown="if(event.key==='Enter')send()">
    <button id="send-btn" onclick="send()">发送</button>
  </div>
</div>

<div id="page-settings" class="fullpage">
  <div style="position:absolute;top:16px;right:20px;z-index:10;">
    <button class="icon-btn" onclick="closeSettings()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div id="settings-body">
    <div class="settings-title">设置</div>
    <div class="account-card" onclick="switchAccount()">
      <div class="account-avatar" id="account-avatar">🎣</div>
      <div class="account-info">
        <div class="account-name" id="account-name">钓鱼佬</div>
        <div class="account-sub" id="account-sub">点击切换到小克的账号</div>
      </div>
      <div class="account-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>
    <div class="settings-group">
      <div class="settings-row" onclick="openSubpage('map')">
        <div class="s-icon" style="background:#34aadc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg></div>
        <span class="s-label">地图</span>
        <div class="s-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
      <div class="settings-row" onclick="openSubpage('shop')">
        <div class="s-icon" style="background:#ff9500"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>
        <span class="s-label">商店</span>
        <div class="s-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
      <div class="settings-row" onclick="openSubpage('wallet')">
        <div class="s-icon" style="background:#34c759"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="3"/><path d="M16 3H6a2 2 0 0 0-2 2v2"/><circle cx="17" cy="14" r="1.5" fill="currentColor" stroke="none"/></svg></div>
        <span class="s-label">钱包</span>
        <div class="s-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
      <div class="settings-row" onclick="openSubpage('encyclopedia')">
        <div class="s-icon" style="background:#007aff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
        <span class="s-label">图鉴</span>
        <div class="s-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
      <div class="settings-row" onclick="openSubpage('sell')">
        <div class="s-icon" style="background:#ff3b30"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
        <span class="s-label">卖鱼</span>
        <div class="s-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
      <div class="settings-row" onclick="openSubpage('bluetooth')">
        <div class="s-icon" style="background:#5856d6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/></svg></div>
        <span class="s-label">蓝牙</span>
        <div class="s-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </div>
    </div>
  </div>
</div>

<div id="page-sub" class="fullpage">
  <div class="fp-nav">
    <button class="fp-back" onclick="closeSubpage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      设置
    </button>
    <div class="fp-title" id="subpage-title">—</div>
  </div>
  <div class="subpage-body" id="subpage-body"></div>
</div>

<div class="enc-modal-bg" id="enc-modal-bg" onclick="closeEncModal(event)">
  <div class="enc-modal" id="enc-modal">
    <div class="enc-modal-name" id="enc-modal-name">—</div>
    <div class="enc-modal-meta">
      <span class="enc-modal-type" id="enc-modal-type">—</span>
      <span class="enc-modal-status" id="enc-modal-status">—</span>

let currentAccount = 0;

function switchAccount() {
  currentAccount = (currentAccount + 1) % accounts.length;
  const a = accounts[currentAccount];
  document.getElementById('account-name').textContent = a.name;
  document.getElementById('account-avatar').textContent = a.avatar;
  document.getElementById('account-sub').textContent = a.sub;
}
function isKiroAccount() { return accounts[currentAccount].isKiro; }

function parseStats(text) {
  const m = text.match(/📊\s*(\{[^\n]*\})/);
  if (!m) return null;
  try { return JSON.parse(m[1]); } catch { return null; }
}
function cleanOutput(text) {
  return text.replace(/\n?📊\s*\{[^\n]*\}\s*$/, '').trim();
}
function updateTopbar(s) {
  if (!s) return;
  document.getElementById('stat-pts').textContent  = s.pts  ?? '—';
  document.getElementById('stat-loc').textContent  = s.loc  ?? '—';
  document.getElementById('stat-turn').textContent = s.turn ?? '—';
  document.getElementById('stat-enc').textContent  = s.enc  ?? '—';
}
function recordLedger(cmd, before, after) {
  if (!before || !after) return;
  const diff = (after.pts ?? 0) - (before.pts ?? 0);
  if (diff !== 0) {
    const type = diff < 0 ? '支出' : '收入';
    ledger.push({ cmd, diff, type });
  }
}
let lastStats = null;

async function send(cmd) {
  const q = cmd || input.value.trim();
  if (!q) return;
  input.value = '';
  const before = lastStats;
  const wrap = document.createElement('div'); wrap.className = 'msg-wrap';
  const card = document.createElement('div'); card.className = 'msg-card';
  card.textContent = '…';
  wrap.appendChild(card); output.appendChild(wrap);
  output.scrollTop = output.scrollHeight;
  try {
    const user = isKiroAccount() ? 'kiro' : 'yy';
const r = await fetch('/cmd?q=' + encodeURIComponent(q) + '&user=' + user);
    const d = await r.json();
    const s = parseStats(d.result);
    card.textContent = cleanOutput(d.result);
    if (s) { recordLedger(q, before, s); updateTopbar(s); lastStats = s; }
  } catch(e) { card.textContent = '请求失败：' + e; }
  output.scrollTop = output.scrollHeight;
}

let allShopItems = [];

function parseShopText(text) {
  const items = [];
  for (const line of text.split('\n')) {
    const m = line.match(/\[([^\]]+)\]\s+(.+?)\s+(\d+)\s*点/);
    if (m) {
      const id = m[1].trim(), name = m[2].trim(), price = parseInt(m[3]);
      const descM = line.match(/[（(]([^）)]+)[）)]/);
      const desc = descM ? descM[1] : (ITEM_DESCS[id] || '');
      items.push({ id, name, price, desc });
    }
  }
  return items;
}
function renderShopItems(items) {
  const list = document.getElementById('shop-items-list');
  if (!list) return;
  if (items.length === 0) { list.innerHTML = '<div class="shop-loading">没有找到相关物品</div>'; return; }
  list.innerHTML = items.map(item =>
    '<div class="shop-item" onclick="buyItem(\'' + item.id + '\',\'' + item.name + '\')">' +
    '<div class="shop-thumb"></div>' +
    '<div class="shop-info"><div class="shop-name">' + item.name + '</div>' +
    '<div class="shop-desc">' + (item.desc||'暂无介绍') + '</div></div>' +
    '<div class="shop-price">' + (item.price>0 ? item.price+'点' : '—') + '</div></div>'
  ).join('');
}
function filterShop(q) {
  const kw = q.trim().toLowerCase();
  if (!kw) { renderShopItems(allShopItems); return; }
  renderShopItems(allShopItems.filter(i =>
    i.name.toLowerCase().includes(kw)||i.id.toLowerCase().includes(kw)||(i.desc||'').toLowerCase().includes(kw)
  ));
}

    '<div class="shop-items" id="shop-items-list"><div class="shop-loading">加载中…</div></div>';
  try {
    const user = isKiroAccount() ? 'kiro' : 'yy';

  closeSubpage();
  await send('buy ' + id + ' ' + qty);
}

function parseSellText(text) {
  const items = [];
  for (const line of text.split('\n')) {
    const m = line.match(/^\s*(c_\d+)\s+(.+?)\s+([\d.]+cm)\s+(\d+)点/);
    if (m) {
      items.push({ id:m[1].trim(), name:m[2].trim(), size:m[3].trim(), price:parseInt(m[4]) });
    }
  }
  return items;
}

const r = await fetch('/cmd?q=inventory&user=' + user);

let encFilter = 'all';
let encUnlocked = new Set();
  
async function renderEncyclopedia(body) {
try {
  const user = isKiroAccount() ? 'kiro' : 'yy';
  const r = await fetch('/cmd?q=encyclopedia&user=' + user);
  const d = await r.json();
  const text = d.result;
  encUnlocked = new Set();
  for (const fish of FISH_DB) {
    if (text.includes(fish.name) || text.includes(fish.id)) encUnlocked.add(fish.id);
  }  
} catch(e) { encUnlocked = new Set(); }

      
  encFilter = 'all';
  renderEncBody(body);
}

function renderEncBody(body) {
  let html =
    '<div class="shop-search-wrap"><div class="shop-search">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
    '<input id="enc-search-input" placeholder="搜索鱼类…" oninput="filterEnc(this.value)">' +
    '</div></div>' +
    '<div class="enc-filter">' +
    '<button class="enc-filter-btn' + (encFilter==='unlocked'?' active':'') + '" onclick="setEncFilter(\'unlocked\')">已解锁</button>' +
    '<button class="enc-filter-btn' + (encFilter==='locked'?' active':'') + '" onclick="setEncFilter(\'locked\')">未解锁</button>' +
    '</div>' +
    '<div class="enc-grid" id="enc-grid"></div>';
  body.innerHTML = html;
  renderEncGrid(FISH_DB);
}

function setEncFilter(f) {
  encFilter = encFilter === f ? 'all' : f;
  const body = document.getElementById('subpage-body');
  renderEncBody(body);
  const searchInput = document.getElementById('enc-search-input');
  if (searchInput && searchInput.value) filterEnc(searchInput.value);
}

function filterEnc(q) {
  const kw = q.trim().toLowerCase();
  const filtered = kw
    ? FISH_DB.filter(f => f.name.toLowerCase().includes(kw) || f.type.toLowerCase().includes(kw))
    : FISH_DB;
  renderEncGrid(filtered);
}

function renderEncGrid(list) {
  let items = list;
  if (encFilter === 'unlocked') items = list.filter(f => encUnlocked.has(f.id));
  if (encFilter === 'locked')   items = list.filter(f => !encUnlocked.has(f.id));
  const grid = document.getElementById('enc-grid');
  if (!grid) return;
  if (items.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#aaa;padding:40px 0">暂无数据</div>';
    return;
  }
  grid.innerHTML = items.map(f => {
    const locked = !encUnlocked.has(f.id);
    return '<div class="enc-card" onclick="openEncModal(\'' + f.id + '\')">' +
      '<div class="enc-img' + (locked?' locked':'') + '"></div>' +
      '<div class="enc-card-name' + (locked?' locked':'') + '">' + (locked?'???':f.name) + '</div>' +
      '</div>';
  }).join('');
}

function openEncModal(id) {
  const f = FISH_DB.find(x => x.id === id);
  if (!f) return;
  const locked = !encUnlocked.has(f.id);
  document.getElementById('enc-modal-name').textContent = locked ? '???' : f.name;
  document.getElementById('enc-modal-type').textContent = locked ? '未知类型' : f.type;
  const statusEl = document.getElementById('enc-modal-status');
  statusEl.textContent = locked ? '未解锁' : '已解锁';
  statusEl.className = 'enc-modal-status ' + (locked ? 'locked' : 'unlocked');
  document.getElementById('enc-modal-desc').textContent = locked ? '钓到这种鱼后解锁详细信息。' : f.desc;
  document.getElementById('enc-modal-bg').classList.add('open');
}
function closeEncModal(e) {
  if (!e || e.target === document.getElementById('enc-modal-bg'))
    document.getElementById('enc-modal-bg').classList.remove('open');
}

function renderWallet(body) {
  const total = lastStats ? lastStats.pts : '—';
  const owner = isKiroAccount() ? '小克' : '钓鱼佬';
  const rows = ledger.length === 0
    ? '<div class="wallet-row"><div class="wallet-row-left"><span class="wallet-row-label">暂无明细</span></div><span class="amount">—</span></div>'
    : ledger.slice().reverse().map(e => {
        const amtStr = (e.diff > 0 ? '+' : '') + e.diff + '¥';
        return '<div class="wallet-row">' +
          '<div class="wallet-row-left">' +
          '<span class="wallet-row-type">' + e.type + '</span>' +
          '<span class="wallet-row-label">' + e.cmd + '</span>' +
          '</div>' +
          '<span class="amount' + (e.diff<0?' neg':'') + '">' + amtStr + '</span>' +
          '</div>';
      }).join('');
  body.innerHTML =
    '<div class="mcp-card"><h3>' + owner + ' 的钱包</h3>' +
    '<div style="font-size:36px;font-weight:700;color:#111;margin:8px 0 4px">' + total +
    ' <span style="font-size:16px;color:#aaa">¥</span></div>' +
    '<div style="font-size:12px;color:#aaa;margin-bottom:16px">当前余额</div>' +
    rows + '</div>';
}

  body.innerHTML =

    '<h3>AI 接入 · MCP 工具 <span class="mcp-badge">已上线</span></h3>' +

    '<div style="font-size:12px;color:#aaa;margin-bottom:6px">指令接口（GET /mcp/fishing?q=指令）</div>' +
    '<div class="mcp-url">' + url + '?q=cast</div>' +
    '<button class="mcp-copy-btn" id="copybtn" onclick="copyMcp()">复制接口地址</button>' +
    '</div>' +
    '<div class="mcp-card"><h3>使用说明</h3>' +
    '<p>参数 <code style="background:#f2f2f7;padding:2px 6px;border-radius:4px">q</code> 传入指令，如 <code style="background:#f2f2f7;padding:2px 6px;border-radius:4px">cast</code>、<code style="background:#f2f2f7;padding:2px 6px;border-radius:4px">status</code>，返回 JSON {"result":"..."}。</p>' +
    '</div>';
}

function copyMcp() {
  const url = BASE + '/mcp/fishing';
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('copybtn');
    btn.textContent = '已复制！';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制接口地址'; btn.classList.remove('copied'); }, 2000);
  });
}

const r = await fetch('/cmd?q=status&user=' + user);

    const s = parseStats(d.result);
    const card = document.createElement('div'); card.className = 'msg-card';
    card.textContent = cleanOutput(d.result);
    const wrap = document.createElement('div'); wrap.className = 'msg-wrap';
    wrap.appendChild(card); output.appendChild(wrap);
    if (s) { updateTopbar(s); lastStats = s; }
  } catch(e) { setTimeout(init, 2000); }
}
init();
</script>
